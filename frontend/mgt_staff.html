<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" href="/img/mnl_icon.png">
  <title>Staff Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body onload="initPage()">

<!-- ================= Sidebar ================= -->
<div class="sidebar" id="sidebar_box"></div>

<!-- ================= Main ================= -->
<div id="main" class="main">
  <!-- 顶部 -->
  <h2 style="text-align: left;">Staff Management</h2>
  <div class="topbar">

    <div class="top-actions">
	  <button class="btn" onclick="openAddDialog()">+ Add Staff</button>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <table id="dataaTable">
      <thead>
        <tr>
          <th>STAFF ID</th>
          <th>STAFF NAME</th>
          <th>ROLE</th>
          <th>COMPANY CODE</th>
		  <th>COMPANY NAME</th>
		  <th>ACTION</th>
        </tr>
      </thead>
      <tbody id="staffTable">
		 <tr><td colspan="11">LOADING...</td></tr>
	  </tbody>
    </table>
  </div>

</div>

<!-- ================= Modal (Add/Edit) ================= -->
<div id="staffModal" class="modal">
  <div class="modal-content">

    <h3 id="modalTitle">ADD STAFF</h3>
	<select id="modalCompany"  placeholder="COMPANY"></select>
    <input id="modalName" placeholder="NAME">
    <input id="modalPassword" type="password" placeholder="PASSWORD">

    <div class="modal-actions">
      <button onclick="saveStaff()">SAVE</button>
      <button onclick="closeModal()">CANCEL</button>
    </div>

  </div>
</div>

<!-- ================= Modal (Change Password) ================= -->
<div id="passwordModal" class="modal">
  <div class="modal-content">

    <h3>Change Password</h3>

    <input id="newPassword" type="password" placeholder="New Password">

    <div class="modal-actions">
      <button onclick="submitPassword()">Update</button>
      <button onclick="closePasswordModal()">Cancel</button>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
	window.addEventListener("DOMContentLoaded", () => {
  initSidebarState();
});

</script>
</body>
</html>

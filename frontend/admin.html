<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/style.css">
  
  <link rel="icon" href="/img/mnl_icon.png">
  <title>DIGITAL ATTENDANCE</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body onload="initPage()">
<div class="layout">
	<div class="sidebar" id="sidebar_box"></div>
	 

	<!-- 主内容 -->
	<div id="main" class="main">

	  

	  <!-- 标题 -->
	  <h2>ATTENDANCE RECORD</h2>
		<!-- 顶部 -->
	  <div class="topbar">

		<div class="top-actions">

		  <input type="text" id="monthFilter" class="input-month" placeholder="选择月份">
		  <input type="text" id="searchInput" placeholder="搜索员工..." onkeyup="filterTable()">
		  <button class="btn" onclick="exportExcel()">EXPORT</button>
		</div>
	  </div>
	  <!-- 表格卡片 -->
	  <div class="card">
		<table id="dataTable">
		  <thead>
			<tr>
			  <th>STAFF ID</th>
			  <th>STAFF NAME</th>
			  <th>COMPANY</th>
			  <th>DATE</th>
			  <th>TIME_IN</th>
			  <th>TIME_OUT</th>
			  <th>LOCATION_IN</th>
			  <th>LOCATION_OUT</th>
			  <th>IP_IN</th>
			  <th>IP_OUT</th>
			  <th>STATUS</th>
			</tr>
		  </thead>
		  <tbody id="tableBody">
			<tr><td colspan="11">LOADING...</td></tr>
		  </tbody>
		</table>
	  </div>

	</div>
</div>
</body>


<script>
// =====================
// ✅ 搜索过滤
// =====================
function filterTable() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#tableBody tr");

  rows.forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}

// =====================
// ✅ 退出
// =====================
function logout() {
  localStorage.clear();
  location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", function () {

  const fp = flatpickr("#monthFilter", {
    dateFormat: "Y-m",
    plugins: [
      new monthSelectPlugin({
        shorthand: true,
        dateFormat: "Y-m",
        altFormat: "F Y"
      })
    ],
    defaultDate: new Date(new Date().setMonth(new Date().getMonth() - 1)),
    onChange: function () {
      loadAll();
    }
  });

  window.fp = fp;
  
  initSidebarState();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
<script src="app.js"></script>
</html>

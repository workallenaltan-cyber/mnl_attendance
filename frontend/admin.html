<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/style.css">
  
  <link rel="icon" href="/img/mnl_icon.png">
  <title>DIGITAL ATTENDANCE</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body onload="initPage()">
<div class="layout">
	<div class="sidebar" id="sidebar_box"></div>
	 

	<!-- 主内容 -->
	<div id="main" class="main">

	  

	  <!-- 标题 -->
	  <h2>ATTENDANCE RECORD</h2>
		<!-- 顶部 -->
	  <div class="topbar">

		  <!-- 左边 -->
		  <div class="top-left">
			<button class="btn" onclick="openAttendanceDialog()">Add/Edit</button>
		  </div>

		  <!-- 右边 -->
		  <div class="top-actions">
			<input type="text" id="monthFilter" class="input-month" placeholder="Month">
			<input type="text" id="searchInput" placeholder="staff..." onkeyup="filterTable()">
			<button class="btn" onclick="exportExcel()">EXPORT</button>
		  </div>

	  </div>
	  <!-- 表格卡片 -->
	  <div class="card">
		<table id="dataTable">
		  <thead>
			<tr>
			  <th>STAFF ID</th>
			  <th>STAFF NAME</th>
			  <th>COMPANY</th>
			  <th>DATE</th>
			  <th>TIME_IN</th>
			  <th>TIME_OUT</th>
			  <th>LOCATION_IN</th>
			  <th>LOCATION_OUT</th>
			  <th>IP_IN</th>
			  <th>IP_OUT</th>
			  <th>STATUS</th>
			</tr>
		  </thead>
		  <tbody id="tableBody">
			<tr><td colspan="11">LOADING...</td></tr>
		  </tbody>
		</table>
	  </div>

	</div>
	
	<!-- =====================================================
		 ATTENDANCE ADD / EDIT MODAL
	===================================================== -->

	<div id="attendanceModal" class="modal">

	  <div class="modal-content attendance-modal">

		<!-- HEADER -->

		<div class="modal-header">

		  <h3 id="attendanceModalTitle">
			ADD / EDIT ATTENDANCE
		  </h3>

		</div>


		<!-- BODY -->

		<div class="attendance-modal-body">

		  <!-- ==========================================
			   DATE
		  =========================================== -->

		  <label for="attendanceDate">
			DATE
		  </label>

		  <input
			type="date"
			id="attendanceDate"
		  >


		  <!-- ==========================================
			   STAFF
		  =========================================== -->

		  <label for="attendanceEmployee">
			STAFF
		  </label>

		  <select id="attendanceEmployee">

			<option value="">
			  SELECT STAFF
			</option>

		  </select>


		  <!-- ==========================================
			   RECORD STATUS
		  =========================================== -->

		  <div
			id="attendanceRecordStatus"
			class="attendance-record-status">
		  </div>


		  <!-- ==========================================
			   EDITABLE ATTENDANCE DATA
		  =========================================== -->

		  <div
			id="attendanceEditFields"
			style="display:none;"
		  >

			<label for="attendanceArea">
			  CHECK AREA
			</label>

			<select id="attendanceArea">

			  <option value="">
				SELECT COMPANY
			  </option>

			</select>


			<label for="attendanceCheckIn">
			  CHECK IN
			</label>

			<input
			  type="time"
			  id="attendanceCheckIn"
			>


			<label for="attendanceCheckOut">
			  CHECK OUT
			</label>

			<input
			  type="time"
			  id="attendanceCheckOut"
			>

		  </div>

		</div>


		<!-- FOOTER -->

		<div class="modal-actions">

		  <button
			type="button"
			id="attendanceSaveBtn"
			onclick="saveAttendance()"
			disabled
		  >
			SAVE
		  </button>

		  <button
			type="button"
			onclick="closeAttendanceDialog()"
		  >
			CANCEL
		  </button>

		</div>

	  </div>

	</div>	
</div>
</body>


<script>
// =====================
// ✅ 搜索过滤
// =====================
function filterTable() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#tableBody tr");

  rows.forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}

// =====================
// ✅ 退出
// =====================
function logout() {
  localStorage.clear();
  location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", function () {

  const fp = flatpickr("#monthFilter", {
    dateFormat: "Y-m",
    plugins: [
      new monthSelectPlugin({
        shorthand: true,
        dateFormat: "Y-m",
        altFormat: "F Y"
      })
    ],
    defaultDate: new Date(new Date().setMonth(new Date().getMonth() - 1)),
    onChange: function () {
      loadAll();
    }
  });

  window.fp = fp;
  
});
</script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
<script src="app.js"></script>
<script src="./admin/attendance_edit.js"></script>
</html>
